apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: agent_relay
  # Same service name ("postgres") and credentials as compose.yaml, just
  # resolved through the cluster's in-namespace DNS instead of Compose's.
  database-url: postgresql+psycopg://relay:relay@postgres:5432/agent_relay
